[package]
name = "orangelink"
version = "0.2.2"
edition = "2021"
description = "Asset library for Windows with a video clip, subtitle and highlight workflow"
publish = false
license = "MIT"

[dependencies]
eframe = "0.29"
# Base colours of both themes (Mocha dark, Latte light); see src/ui/theme.rs.
catppuccin-egui = { version = "5.7", default-features = false, features = ["egui29"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "rayon"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
walkdir = "2"
rayon = "1"
open = "5"
anyhow = "1"
drag = "2.1.1"
trash = "5"
arboard = { version = "3", default-features = false, features = ["image-data"] }
tiny_http = "0.12"
base64 = "0.22"
rodio = { version = "0.20", default-features = false }
encoding_rs = "0.8"
ferrous-opencc = { version = "0.4", default-features = false, features = ["s2t-conversion"] }
notify = "8"
global-hotkey = "0.9"
# Checking downloads.
sha2 = "0.10"
# Drawing a font file's own sample text (thumbnail and preview). egui already uses it.
ab_glyph = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
# Keep panic = "unwind" (the default): the importer catches a decoder's panic
# (`catch_unwind`) and fails only that file. "abort" would close the whole app.

# Image decoding is painfully slow unoptimized; keep dependencies fast in dev builds.
[profile.dev.package."*"]
opt-level = 2

[target.'cfg(windows)'.dependencies]
# The version already in the tree (through other crates), so nothing is built twice.
windows = { version = "0.62", features = ["Data_Pdf", "Foundation", "Storage", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Media_MediaFoundation", "Win32_Security", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
# The window handle for the title bar's theme (already in eframe's tree).
raw-window-handle = "0.6"
# `#[implement]` (the Media Foundation engine's listener) names this crate.
windows-core = "0.62"

[build-dependencies]
embed-resource = "3"
